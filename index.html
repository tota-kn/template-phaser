<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shot Puzzle Prototype</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        /* 長押しで溜めるので、スクロール・ズーム・文字選択・長押しメニューを止める */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 1;
          justify-content: center;
          align-items: center;
          background: #000;
          color: #eceff1;
          font: 24px sans-serif;
        }
      }
      #game-container:fullscreen,
      #game-container:-webkit-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="rotate">横向きにして遊んでください</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
